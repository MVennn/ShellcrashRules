# 备用节点入口模板：同一地区可以补多个入口，端口与 WS Host 按你的订阅填写。
#
# ⚠️ 这是**模板**。真实值（含 vmess uuid）放在同目录的 `proxies.yaml` 里，
#    而 `proxies.yaml` 已被 `.gitignore` 排除 —— 克隆本仓后按下面的步骤重建：
#
#      cp config/yamls/proxies.example.yaml config/yamls/proxies.yaml
#      # 然后把 <YOUR-...> / <REPLACE-...> 占位符替换成真实值
#
#    本文件由 starts/clash_modify.sh 合并进生成的 config.yaml（见 docs/ARCHITECTURE.md §3）。
- {name: 🇮🇳 印度-备用m2, server: <YOUR-NODE-SERVER>, port: <YOUR-NODE-PORT>, type: vmess, uuid: <REPLACE-VMESS-UUID>, alterId: 0, cipher: auto, tls: false, skip-cert-verify: false, network: ws, ws-opts: {path: /, headers: {Host: <YOUR-WS-HOST>}}, udp: true}
- {name: 🇮🇳 印度-备用ct2, server: <YOUR-NODE-SERVER>, port: <YOUR-NODE-PORT>, type: vmess, uuid: <REPLACE-VMESS-UUID>, alterId: 0, cipher: auto, tls: false, skip-cert-verify: false, network: ws, ws-opts: {path: /, headers: {Host: <YOUR-WS-HOST>}}, udp: true}
