# ============================================================
# ShellCrash 自定义策略组
# 每次启动 / 更新订阅时由 starts/clash_modify.sh 自动合并，不会被订阅覆盖
#
# 语法：- name: 组名#要挂进哪个现有组#可以写多个
# 节点筛选用正则，订阅更新/节点改名后自动跟随，无需重新调优
#
# 展示顺序不由此文件的顺序决定：由 config/hooks/reorder-groups.sh 的 order[] 维护。
# 新增 / 改名 / 删除组时必须同步 order[]（组顺序，必要时再改主选择器成员顺序 /
# 节点排序目标）；漏加不会报错，但组会掉到面板最后。
# 排序规则正本：docs/ARCHITECTURE.md「代理组排序规则（新增组必须遵守）」。
# ============================================================

# AI API 专用出口：健康检查直接打 opencode.ai，按真实 API 延迟选路
# 覆盖全部机场节点（含印度/加拿大/德国/英国）
# 必须排除香港：OpenAI 上游会返回 unsupported_country_region_territory
# 必须排除公共节点：陌生人的出口可能记录/篡改 API 流量（2026-10-21 实测
#   🆓 公共-01 延迟最低时会被 url-test 选中，所以这里必须硬排除）。
- name: 🤖 AI接口#🚀 节点选择
  type: url-test
  url: https://opencode.ai/
  # 容差 50ms: 延迟差小于 50ms 不换节点 —— 出口 IP 稳定, 避免 API 会话中途换 IP
  tolerance: 50
  include-all-proxies: true
  exclude-filter: "过滤|流量|到期|剩余|套餐|香港|HK|Hong Kong|公共"

# AI 网页专用出口：按 ChatGPT 真实握手延迟选路
# 新加坡出口对 chatgpt.com 常返回 504，用 expected-status 直接排除
# 挂进 🤖 人工智能 作为选项，需在面板选中它
#CLEAN_EXIT_MARKER 2026-10-20：Google 把本机场多数出口 IP 判为 CN，
#  url-test 按延迟会把出口漂到被判定为中国区的节点 → Gemini 报「不支持此国家」。
#  改为 select 固定出口（成员含印度=Google 判定干净的稳定节点），
#  具体选哪个由守护进程按 Google 侧 cc 实测自动维护。
- name: 🤖 AI网页#🤖 人工智能
  type: select
  include-all-proxies: true
  filter: "(印度|India|IN|台湾-优化3|新加坡|HY2)"
  exclude-filter: "过滤|流量|到期|剩余|套餐|香港|HK|Hong Kong|公共"

# ============================================================
# 补齐模板没有单独分组的地区（原模板只有港/台/新/日/美）
# ============================================================
- name: 🇮🇳 印度节点#🚀 节点选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  include-all-proxies: true
  filter: "(印度|India|孟买|Mumbai)"

- name: 🇨🇦 加拿大节点#🚀 节点选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  include-all-proxies: true
  filter: "(加拿大|Canada|多伦多|温哥华|Toronto|Vancouver)"

- name: 🇩🇪 德国节点#🚀 节点选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  include-all-proxies: true
  filter: "(德国|Germany|法兰克福|Frankfurt)"

- name: 🇬🇧 英国节点#🚀 节点选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  include-all-proxies: true
  filter: "(英国|United Kingdom|伦敦|London|UK|GB)"

#CLEAN_EXIT_GROUP_MARKER 2026-10-20：唯一经 Google cc 实测判为非 CN 的稳定出口
# 用 select 不用 url-test：url-test 会按延迟漂到被判 CN 的日本/香港节点
# （实测 28 节点里印度延迟排第 17，url-test 永远选不到它）
# 2026-10-21 复测：机场按目标分配落地，google.com 的落地被 Google 判 CN，
#   30 个节点里只有「🇹🇼 台湾-优化3」判为 TW（其余全 CN / 少数超时）。
#   台湾-优化3 不在印度过滤条件内，所以显式加进 filter；
#   guardian.sh 的 is_bad_node 也要给它开例外，否则每 5 分钟会被切回印度。
# 2026-10-22 追加 新加坡|HY2：vmess 池（含「新加坡-优化3」）实测整池 cc=CN，
#   真正可用的是 Hysteria2 池（新加坡/日本/韩国/HK 四个节点全部 cc=SG）。
#   filter 必须能匹配到 HY2 名字，否则 guardian 的候选里有几个「组里根本没有」。
#   节点本身由 starts/sub-sync.sh 自动补齐，见 proxies.example.yaml 的说明。
- name: 🤖 干净出口#🤖 人工智能
  type: select
  include-all-proxies: true
  filter: "(印度|India|IN|台湾-优化3|新加坡|HY2)"
  exclude-filter: "过滤|流量|到期|剩余|套餐|香港|HK|Hong Kong|公共"

# ============================================================
# 🎬 B站 —— API 出国、CDN 直连
#
# 目的：让评论 / 主页的「IP 属地」显示为节点所在国家，同时视频流量仍走国内直连。
# B站属地由「发请求那一刻的源 IP」决定，没有独立的检测接口：
#   API 域名（api/app/cm.bilibili.com、biliapi.com/.net）必须真的从国外出去；
#   CDN（bilivideo/hdslb/biliimg/acgvideo）保持直连，视频不占机场流量。
# 规则见 rules.yaml 的 J 段。
#
# 为什么不用 HY2 池（2026-10-22 实测）：
#   HY2 的香港/韩国节点能连 gstatic，但百度、知乎、www/api.bilibili.com 全部
#   TLS EOF / 超时；日本/新加坡节点本身超时。HY2 池到大陆方向不通。
#   vmess 池的 香港WAP / 台湾-优化3 / 日本-优化 / 新加坡-优化3 可正常访问 B站，
#   B站 zone 实测分别显示 香港 / 台湾 / 日本 / 新加坡。
#   （Google 把 vmess 池判 cc=CN 是 Google 侧的反滥用口径，与 B站属地无关。）
# 用 select 不用 url-test：属地要稳定，url-test 会在港/台/日/新之间漂。
# 默认 香港WAP-优化：实测延迟最低（152ms）且能解锁港澳台番剧；要换地区在面板里切。
# ============================================================
- name: 🎬 B站解锁#🚀 节点选择
  type: select
  include-all-proxies: true
  filter: "(香港WAP|台湾-优化3|日本-优化|新加坡-优化3)"
  exclude-filter: "过滤|流量|到期|剩余|套餐|公共"

# ============================================================
# 🔗 GitHub 出口 —— 按 GitHub 真实可达性自动选路（2026-10-22）
#
# 2026-10-22 事故：干净出口按 Gemini 吞吐选到了 🇰🇷 韩国KR-HY2，
#   而该节点到 GitHub 实测 0/5（台湾-优化3 是 4/5），结果是 GitHub 全族
#   时通时断，PC 侧 git/gh 报 `schannel: failed to receive handshake`。
# 结论：GitHub 与 Google 需要的能力不同，不能共用一个出口组 ——
#   Google 要求 cc≠CN（只有 HY2 池 / 台湾-优化3 满足）；
#   GitHub 只要求「能稳定握手」，几乎所有节点都满足，但单节点会抖。
# 做法：url-test 直接拿 `github.com/robots.txt` 当健康检查（200、几 KB、
#   不重定向、不需要鉴权），每 60 秒复测；某个节点握手开始抖就被判死、
#   自动换下一个。这是内核级故障转移，比脚本轮询快，也不需要额外状态。
# 不收公共节点：`git push` 带 token，不能过陌生人的机器。
# ============================================================
- name: 🔗 GitHub 出口#🚀 节点选择
  type: url-test
  url: https://github.com/robots.txt
  interval: 60
  timeout: 5000
  tolerance: 50
  include-all-proxies: true
  exclude-filter: "过滤|流量|到期|剩余|套餐|公共"

# ============================================================
# 𝕏 媒体 —— X / Twitter 图片与视频 CDN（twimg.com）
#
# 2026-10-23 白天实测（10 并发真实图片，PC 走路由器透明代理）：
#   VMess+WS（当前自动选择里的日本/香港节点）并发建连被串行化：
#     单张 0.9–1.9s、偶发 5–6s；10 并发墙钟 1.9–5.9s。
#   HY2（QUIC 多路复用，日本/香港）不必重复付 WS 握手：
#     10 并发墙钟 0.35s，单张 0.21–0.25s。
#   单请求延迟看不出差别（HY2 89ms vs VMess 65ms），所以健康检查
#   按延迟选不出这个差异 —— HY2 主组里只放 HY2，不能掺 VMess。
#   pbs 根路径返回 400 且抖动大（HK-HY2 会误判超时），
#   改用同域 robots.txt（200、稳定）做 url-test。
#
# 2026-10-23 晚：HY2 池对 pbs.twimg.com 全部超时（4/4 504），
#   VMess 节点同域 5/5 200（日本 79ms / 香港 152ms / 新加坡 107ms）。
#   于是拆成 HY2 主 + VMess 备的 fallback：HY2 正常时仍享受 QUIC 并发，
#   HY2 整池劣化时自动落到 VMess，X 图片不会直接失败。
# ============================================================
- name: 𝕏 媒体-HY2
  type: url-test
  url: https://pbs.twimg.com/robots.txt
  interval: 300
  timeout: 5000
  tolerance: 50
  include-all-proxies: true
  filter: "HY2"
  exclude-filter: "过滤|流量|到期|剩余|套餐|公共"

- name: 𝕏 媒体-备用
  type: url-test
  url: https://pbs.twimg.com/robots.txt
  interval: 300
  timeout: 5000
  tolerance: 50
  include-all-proxies: true
  exclude-filter: "HY2|公共|过滤|流量|到期|剩余|套餐"

- name: 𝕏 媒体#🚀 节点选择
  type: fallback
  url: https://pbs.twimg.com/robots.txt
  interval: 300
  timeout: 5000
  lazy: false
  proxies:
    - 𝕏 媒体-HY2
    - 𝕏 媒体-备用

# ============================================================
# 🆓 公共备用 —— AutoMergePublicNodes（NoMoreWalls fork）公开节点
#
# 定位：机场入口全挂时的网页保底通道，挂在 🚀 节点选择 末尾。
# 公开节点由陌生人运营，可能记录/篡改流量：
#   **禁止用于 AI、网银、邮箱、社交账号登录等敏感流量。**
# AI 仍走 🤖 AI接口 / 🤖 干净出口。
#
# 节点由 `🆓 公共-NN` 命名，本地写入 /etc/ShellCrash/yamls/proxies.yaml
# （含公开凭据，不入库）。组用 include-all-proxies + filter 自动纳管。
# url-test 每 10 分钟测一次 gstatic，坏的节点自动被绕过。
# ============================================================
- name: 🆓 公共备用#🚀 节点选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  timeout: 5000
  tolerance: 100
  include-all-proxies: true
  filter: "🆓 公共"

# ============================================================
# 📺 大流量 —— 已知的大文件下载走公共池，省机场流量
#
# 由 rules.yaml 的几段指进来：
#   H. 大流量：Epic 下载 CDN、proof.ovh.net（守卫探测域，Range 取前 4MB）
#   Steam 于 2026-10-27 移出本组：depot CDN（steamcontent.com）改直连，
#     steamstatic / steamcdn-a / steampipe 改走 🚀 节点选择（见 rules.yaml G2 段）
#   I. 视频站点 + Telegram：成人站与其自有 CDN、Telegram 的两个 DC 段
#      （媒体与消息走同一条 MTProto 连接，没法只挑视频，只能整段接）
#   K. 大流量补充：HuggingFace LFS / GitHub 发布包 / NVIDIA+AMD 驱动 /
#      暴雪·GOG·EA·育碧补丁 / Maven 中央仓库
#      （实测公共池 1.5 MB/s 不慢于机场，见 K 段注释）
#
# 订阅流媒体刻意不进来：
#   - YouTube 全族必须走 🤖 干净出口 —— 通用池出口被 Google 判 CN，会限流/报错；
#   - Netflix / Disney 对公共节点几乎必然判代理（公共池是陌生人共享出口）。
#   成人站不绑账号/支付出口、全程 HTTPS，公共节点看不到内容，所以可以接。
#
# type 用 select 而不是 url-test：组内只有两个候选，选谁由 bulk-guard.sh
# 按**真实吞吐**决定 —— mihomo 的 url-test/fallback 只测首包延迟，不测带宽
# （实测 /proxies/<节点>/delay 请求 3MB 只花 233ms，正文没传）。
# 公共池自己仍是 url-test，池内坏节点照旧自动绕过。
#
# 默认成员 = 🆓 公共备用；守卫实测低于阈值（默认 800 KB/s ≈ 持续 10 Mbps）
# 会切到 ♻️ 自动选择。
# ============================================================
- name: 📺 大流量#🚀 节点选择
  type: select
  proxies:
    - 🆓 公共备用
    - ♻️ 自动选择

# ============================================================
# 🛟 主备自动 —— 机场自动选择优先，机场全挂时自动落到公共备用
#
# 只挂进 🚀 节点选择（并设为默认项），不碰 AI 组：公开节点不进 AI。
# fallback 按顺序取第一个健康成员：
#   1) ♻️ 自动选择 —— 机场节点 url-test，正常时永远用它；
#   2) 🆓 公共备用 —— 机场全挂/全部超时才启用。
# 故意不放 DIRECT：两边都挂时宁可连不上，也不静默直连泄露真实 IP。
# ============================================================
- name: 🛟 主备自动#🚀 节点选择
  type: fallback
  url: http://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  lazy: false
  proxies:
    - ♻️ 自动选择
    - 🆓 公共备用
